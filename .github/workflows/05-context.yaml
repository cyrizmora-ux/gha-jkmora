name: 05 workflow context

on: [workflow_dispatch, push]
 
jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
          - name: event test
          - name: GitHub information
            run: |
                echo "Event: ${{ github.event_name }}"
                echo "Repository: ${{ github.repository }}"
                echo "Actor: ${{ github.actor }}"
                echo "SHA: ${{ github.sha }}"
                echo "Ref: ${{ github.ref }}"
                        