
name: 03 - Using Actions

on: [push, workflow_dispatch]


jobs:
    build:
     runs-on: ubuntu-latest
     defaults:
        run:
          working-directory: 03-using actions/react-app
     steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: 20
        - name: Install Dependencies
          run: npm ci
        - name: Run test  
          run: npm run test
         
        
        
       