
name: 03 - Using Actions

on: push


jobs:
    build:
     runs-on: ubuntu-latest
     steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20.x'
        - name: Install Dependencies
          run: npm ci
          working-directory: ./03-using-actions

        
        
       